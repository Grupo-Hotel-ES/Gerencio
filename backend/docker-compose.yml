x-api-common: &api-common
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  environment: &api-env
    DATABASE_URL: postgresql://${POSTGRES_USER:-geroncio}:${POSTGRES_PASSWORD:-geroncio_dev}@postgres:5432/${POSTGRES_DB:-geroncio}
    NODE_ENV: production

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: geroncio-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geroncio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geroncio_dev}
      POSTGRES_DB: ${POSTGRES_DB:-geroncio}
    volumes:
      - geroncio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-geroncio} -d ${POSTGRES_DB:-geroncio}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api-clientes:
    <<: *api-common
    container_name: geroncio-api-clientes
    build:
      context: .
      dockerfile: ./api-clientes/Dockerfile
    ports:
      - "3001:3001"
    environment:
      <<: *api-env
      PORT: 3001

  api-pedidos:
    <<: *api-common
    container_name: geroncio-api-pedidos
    build:
      context: .
      dockerfile: ./api-pedidos/Dockerfile
    ports:
      - "3002:3002"
    environment:
      <<: *api-env
      PORT: 3002

  api-restaurantes:
    <<: *api-common
    container_name: geroncio-api-restaurantes
    build:
      context: .
      dockerfile: ./api-restaurantes/Dockerfile
    ports:
      - "3003:3003"
    environment:
      <<: *api-env
      PORT: 3003

  api-produtos:
    <<: *api-common
    container_name: geroncio-api-produtos
    build:
      context: .
      dockerfile: ./api-produtos/Dockerfile
    ports:
      - "3004:3004"
    environment:
      <<: *api-env
      PORT: 3004

  # Workflows do chatbot. Usa o SQLite interno do n8n (volume próprio) para não
  # criar tabelas no banco do Prisma. Dentro da rede do compose, as APIs ficam
  # em http://api-<nome>:<porta>/api (ex.: http://api-pedidos:3002/api).
  chatbot:
    container_name: geroncio-chatbot
    restart: unless-stopped
    build:
      context: ./chatbot
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
    volumes:
      - geroncio_n8ndata:/home/node/.n8n

  # API do WhatsApp usada pelo chatbot. As tabelas dela ficam no schema
  # "evolution" do mesmo Postgres, separadas do schema "public" do Prisma.
  # DOCKER_ENV=true faz o entrypoint usar estas variáveis em vez de procurar
  # um .env dentro do container.
  evolution-api:
    container_name: evolution_api
    image: evoapicloud/evolution-api:v2.1.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DOCKER_ENV: "true"
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:8080}
      AUTHENTICATION_API_KEY: ${AUTHENTICATION_API_KEY:?defina AUTHENTICATION_API_KEY no backend/.env}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-geroncio}:${POSTGRES_PASSWORD:-geroncio_dev}@postgres:5432/${POSTGRES_DB:-geroncio}?schema=evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  geroncio_pgdata:
  geroncio_n8ndata:
  evolution_instances:
