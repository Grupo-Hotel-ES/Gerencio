x-api-common: &api-common
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  environment: &api-env
    DATABASE_URL: postgresql://${POSTGRES_USER:-geroncio}:${POSTGRES_PASSWORD:-geroncio_dev}@postgres:5432/${POSTGRES_DB:-geroncio}
    NODE_ENV: production

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: geroncio-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geroncio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geroncio_dev}
      POSTGRES_DB: ${POSTGRES_DB:-geroncio}
    volumes:
      - geroncio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-geroncio} -d ${POSTGRES_DB:-geroncio}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api-clientes:
    <<: *api-common
    container_name: geroncio-api-clientes
    build:
      context: .
      dockerfile: ./backend/api-clientes/Dockerfile
    ports:
      - "3001:3001"
    environment:
      <<: *api-env
      PORT: 3001

  api-pedidos:
    <<: *api-common
    container_name: geroncio-api-pedidos
    build:
      context: .
      dockerfile: ./backend/api-pedidos/Dockerfile
    ports:
      - "3002:3002"
    environment:
      <<: *api-env
      PORT: 3002

  api-restaurantes:
    <<: *api-common
    container_name: geroncio-api-restaurantes
    build:
      context: .
      dockerfile: ./backend/api-restaurantes/Dockerfile
    ports:
      - "3003:3003"
    environment:
      <<: *api-env
      PORT: 3003

  api-credencial:
    <<: *api-common
    container_name: geroncio-api-credencial
    build:
      context: .
      dockerfile: ./backend/api-credencial/Dockerfile
    ports:
      - "3004:3004"
    environment:
      <<: *api-env
      PORT: 3004

volumes:
  geroncio_pgdata: