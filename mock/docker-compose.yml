services:
  mock-delivery-db:
    image: postgres:16-alpine
    container_name: gerencio-mock-delivery-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MOCK_DB_USER:-mock}
      POSTGRES_PASSWORD: ${MOCK_DB_PASSWORD:-mock}
      POSTGRES_DB: ${MOCK_DB_NAME:-mock_delivery}
    ports:
      # 5433 no host para não conflitar com o Postgres principal do Gerencio (5432)
      - "${MOCK_DB_PORT:-5433}:5432"
    volumes:
      - mock-delivery-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MOCK_DB_USER:-mock} -d ${MOCK_DB_NAME:-mock_delivery}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mock-api:
    build:
      context: .
      dockerfile: mock_backend/mock_api/Dockerfile
    container_name: gerencio-mock-api
    restart: unless-stopped
    environment:
      MOCK_DATABASE_URL: postgresql://${MOCK_DB_USER:-mock}:${MOCK_DB_PASSWORD:-mock}@mock-delivery-db:5432/${MOCK_DB_NAME:-mock_delivery}?schema=public
      MOCK_API_PORT: 3333
      # Dentro do container, localhost é o próprio mock: os webhooks vão para a api-integracao no host
      IFOOD_WEBHOOK_URL: ${GERENCIO_INTEGRACAO_URL:-http://host.docker.internal:3005}/api/webhooks/ifood
      RAPPI_WEBHOOK_URL: ${GERENCIO_INTEGRACAO_URL:-http://host.docker.internal:3005}/api/webhooks/rappi
      UBER_WEBHOOK_URL: ${GERENCIO_INTEGRACAO_URL:-http://host.docker.internal:3005}/api/webhooks/ubereats
      NOVENTA_NOVE_FOOD_WEBHOOK_URL: ${GERENCIO_INTEGRACAO_URL:-http://host.docker.internal:3005}/api/webhooks/99food
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${MOCK_API_PORT:-3333}:3333"
    depends_on:
      mock-delivery-db:
        condition: service_healthy

volumes:
  mock-delivery-data:
